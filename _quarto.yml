project:
  type: website
  output-dir: docs

website:
  title: "Pharmaverse Clinical Reporting Portfolio"
  description: "Clinical data analysis and reporting using the pharmaverse ecosystem"
  favicon: assets/favicon.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: reports/index.qmd
        text: Reports
      - href: about.qmd
        text: About
    right:
      - icon: github
